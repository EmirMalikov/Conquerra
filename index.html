<!doctype html>
<html lang="en" class="h-full preload" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title data-i18n="main.title">TerraClash</title>
    <link rel="manifest" href="<%- manifestHref %>" />
    <link rel="icon" type="image/svg+xml" href="<%- faviconHref %>" />

    <!-- Preload styles -->
    <style>
      html {
        color-scheme: dark;
      }

      html.preload {
        visibility: visible !important;
        opacity: 1 !important;
        background-color: #111827 !important;
      }

      html.preload body {
        visibility: hidden;
        opacity: 0;
      }

      .preload {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      /* iOS safe area support */
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      /* Ensure full viewport height on iOS; body grows with content so the
         document scrolls (see styles.css) */
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        min-height: 100%;
        min-height: -webkit-fill-available;
      }

      /* Disable iOS double-tap "smart zoom" on the page; the game has its
         own map zoom. Panning/scrolling stays allowed. See issue #4609. */
      html,
      body {
        touch-action: manipulation;
      }
    </style>

    <!-- SEO -->
    <meta
      name="description"
      content="Real-time territory conquest on a map of the real world. Expand from a single point, build cities, ports and factories, launch missiles and control 80% of the world to win. Based on OpenFront (AGPL v3)."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="TerraClash" />
    <meta
      property="og:description"
      content="Real-time territory conquest on a map of the real world. Expand from a single point, build cities, ports and factories, launch missiles and control 80% of the world to win. Based on OpenFront (AGPL v3)."
    />
    <meta property="og:image" content="<%- gameplayScreenshotUrl %>" />
    <meta property="og:type" content="game" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "TerraClash",
        "image": "<%- gameplayScreenshotUrl %>",
        "description": "Real-time territory conquest on a map of the real world. Expand from a single point, build cities, ports and factories, launch missiles and control 80% of the world to win. Based on OpenFront (AGPL v3).",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "gamePlatform": ["Web Browser", "PC", "Mobile"],
        "genre": ["Strategy", "Multiplayer", "IO Game"],
        "playMode": "MultiPlayer",
        "inLanguage": "en",
        "isAccessibleForFree": true
      }
    </script>

    <!--
      Injected from Server env.

      Every per-server value (cluster, instanceLetter, instanceId, serverHost,
      siteHost) is emitted through a guard so the whole line — indentation and
      trailing comma included — disappears when the renderer does not supply
      it. That is what lets one page be rendered per VERSION rather than per
      server and uploaded to the CDN (docs/MultiServer.md, "Publish pipeline
      (v2)"); a game server supplies them all and gets exactly the page it
      always served.

      Never add a placeholder the Steam shell does not supply: openfront-desktop
      renders this same template itself and a missing local is a ReferenceError,
      i.e. a blank window. Guarding an existing one is safe — the shell supplies
      a value and the line still emits.
    -->
    <script>
      window.BOOTSTRAP_CONFIG = {
        gitCommit: <%- gitCommit %>,
        assetManifest: <%- assetManifest %>,
        cdnBase: <%- cdnBase %>,
        gameEnv: <%- gameEnv %>,<%- typeof cluster !== "undefined" && cluster ? "\n        cluster: " + cluster + "," : "" %><%- typeof instanceLetter !== "undefined" && instanceLetter ? "\n        instanceLetter: " + instanceLetter + "," : "" %>
        turnstileSiteKey: <%- turnstileSiteKey %>,
        jwtAudience: <%- jwtAudience %>,<%- typeof stripePublishableKey !== "undefined" && stripePublishableKey ? "\n        stripePublishableKey: " + stripePublishableKey + "," : "" %><%- typeof faroCollectorUrl !== "undefined" && faroCollectorUrl ? "\n        faroCollectorUrl: " + faroCollectorUrl + "," : "" %><%- typeof instanceId !== "undefined" && instanceId ? "\n        instanceId: " + instanceId + "," : "" %><%- typeof serverHost !== "undefined" && serverHost ? "\n        serverHost: " + serverHost + "," : "" %><%- typeof siteHost !== "undefined" && siteHost ? "\n        siteHost: " + siteHost + "," : "" %>
      };
      // Set here rather than from the bundle so the first paint already has the
      // desktop layout. The shell's preload defines openfrontDesktop before
      // any page script runs. ?desktop-layout previews it outside prod.
      if (
        window.openfrontDesktop ||
        (window.BOOTSTRAP_CONFIG.gameEnv !== "prod" &&
          new URLSearchParams(location.search).has("desktop-layout"))
      ) {
        document.documentElement.classList.add("desktop-shell");
      }
      document.documentElement.style.setProperty(
        "--background-image-url",
        `url("<%- backgroundImageUrl %>")`,
      );
      document.documentElement.style.setProperty(
        "--mobile-logo-image-url",
        `url("<%- mobileLogoImageUrl %>")`,
      );
    </script>

    <script>
      // Poki allows no third-party scripts in its frame, so the portal SDK
      // and CrazyGames scripts below load only off Poki (Turnstile still
      // loads: multiplayer joins need its token). Same check as
      // PokiSDK.isOnPoki(), which also keeps a positive answer in
      // sessionStorage for in-frame navigations.
      window.__onPoki = (function () {
        if (window.self === window.top) return false;
        try {
          if (sessionStorage.getItem("onPoki") === "true") return true;
        } catch (e) {}
        var pokiHost = /(^|\.)(poki\.com|poki-gdn\.com|poki\.dev)$/;
        function isPokiUrl(url) {
          try {
            return pokiHost.test(new URL(url).hostname);
          } catch (e) {
            return false;
          }
        }
        var ancestors = location.ancestorOrigins;
        return ancestors && ancestors.length > 0
          ? Array.prototype.some.call(ancestors, isPokiUrl)
          : isPokiUrl(document.referrer);
      })();
      window.__loadThirdPartyScript = function (src, attrs) {
        if (window.__onPoki) return;
        var script = document.createElement("script");
        script.src = src;
        script.async = true;
        for (var name in attrs || {}) script.setAttribute(name, attrs[name]);
        document.head.appendChild(script);
      };
    </script>

    <!-- CrazyGames SDK -->
    <script>
      // Not inside our VIVERSE wrapper, which isn't CrazyGames
      // even though it's an iframe. Same check as ViverseSDK.isOnViverse().
      window.__onViverse = (function () {
        if (window.self === window.top) return false;
        try {
          if (sessionStorage.getItem("onViverse") === "true") return true;
        } catch (e) {}
        var viverseHost = /(^|\.)(viverse\.app|viverse\.com)$/;
        function isViverseUrl(url) {
          try {
            return viverseHost.test(new URL(url).hostname);
          } catch (e) {
            return false;
          }
        }
        var ancestors = location.ancestorOrigins;
        return ancestors && ancestors.length > 0
          ? Array.prototype.some.call(ancestors, isViverseUrl)
          : isViverseUrl(document.referrer);
      })();
      if (!window.__onViverse) {
        __loadThirdPartyScript(
          "https://sdk.crazygames.com/crazygames-sdk-v3.js",
        );
      }
    </script>

    <!-- Cloudflare Turnstile -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>

    <!-- No ad, ad-recovery or analytics scripts in this build (see
         src/client/BuildFlags.ts). -->
  </head>

  <body
    class="select-none font-sans min-h-screen bg-neutral-800 transition-opacity duration-300 ease-in-out flex flex-row flex-wrap content-start"
  >
    <script>
      // Halloween theme (src/client/halloween.css), Oct 25 through Nov 1 local
      // time. It recolors the desktop logo, which is otherwise left unset.
      // The season marker lets the settings toggle (UserSettings.halloweenTheme,
      // same key and default) restyle live without repeating the date check.
      (() => {
        const now = new Date();
        const month = now.getMonth();
        const day = now.getDate();
        if ((month === 9 && day >= 25) || (month === 10 && day === 1)) {
          document.body.dataset.halloweenSeason = "";
          document.documentElement.style.setProperty(
            "--desktop-logo-image-url",
            `url("<%- desktopLogoImageUrl %>")`,
          );
          if (localStorage.getItem("settings.halloweenTheme") !== "false") {
            document.body.classList.add("halloween-theme");
          }
        }
      })();
    </script>
    <!-- Menu backdrop: the game's own world map (resources/maps/world, CC
         BY-SA 4.0) over a deep ocean, darkened toward the edges so the
         panels read on top of it. -->
    <div
      id="hex-grid"
      class="fixed inset-0 -z-50 pointer-events-none overflow-hidden bg-[#0b2a4f]"
    >
      <div
        id="background-layer"
        class="absolute -inset-[4%] bg-cover bg-center opacity-80 [filter:saturate(1.15)_brightness(0.8)]"
        style="background-image: var(--background-image-url)"
      ></div>
      <div
        class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgb(8_18_38/0.15)_0%,rgb(8_18_38/0.55)_55%,rgb(5_10_24/0.92)_100%)]"
      ></div>
    </div>

    <!-- LEFT SIDEBAR MENU -->

    <div
      id="mobile-menu-backdrop"
      class="lg:hidden! in-[.in-game]:hidden hidden pointer-events-none [&.open]:block [&.open]:pointer-events-auto [&.open]:fixed [&.open]:inset-0 [&.open]:bg-black/60 [&.open]:z-[40000] transition-opacity"
      role="presentation"
      aria-hidden="true"
    ></div>

    <mobile-nav-bar
      id="sidebar-menu"
      class="peer [.in-game_&]:hidden z-[40001] fixed left-0 top-0 h-full flex flex-col justify-start overflow-visible bg-black/70 backdrop-blur-xl border-r border-white/10 transition-transform duration-500 ease-out transform -translate-x-full w-[70%] [&.open]:translate-x-0 lg:hidden"
      role="dialog"
      data-i18n-aria-label="main.menu"
    ></mobile-nav-bar>

    <!-- MAIN CONTENT AREA -->
    <div
      class="in-[.in-game]:hidden flex-1 basis-full min-w-0 min-h-dvh in-[.page-open]:min-h-0 in-[.page-open]:overflow-hidden relative pt-[var(--top-ad-pad,0px)] in-[.page-open]:pt-[var(--top-ad-height,0px)] transition-[margin] duration-500 ease-out will-change-[margin-left] flex flex-col"
    >
      <!-- Desktop Top Bar (sticky so it stays visible while the page scrolls,
           offset below the header ad when one is showing; static while an
           inline page is open, when the content area is padded below the ad
           instead and nothing scrolls) -->
      <desktop-nav-bar
        class="sticky top-[var(--top-ad-height,0px)] z-[60] in-[.page-open]:static in-[.page-open]:compact:hidden"
      ></desktop-nav-bar>

      <div
        id="turnstile-container"
        class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-99999"
      ></div>

      <homepage-promos></homepage-promos>
      <banned-modal></banned-modal>
      <marketing-consent-toast></marketing-consent-toast>
      <purchase-nudge-modal></purchase-nudge-modal>

      <!-- Main container with responsive padding -->

        <play-page class="contents"></play-page>
        <matchmaking-modal
          id="page-matchmaking"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></matchmaking-modal>
        <news-modal

        <single-player-modal

          inline
          class="hidden w-full h-full page-content relative z-50"
        ></single-player-modal>
        <host-lobby-modal
          id="page-host-lobby"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></host-lobby-modal>
        <join-lobby-modal

          inline
          class="hidden w-full h-full page-content relative z-50"
        ></join-lobby-modal>
        <store-modal
          id="page-item-store"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></store-modal>
        <user-setting
          id="page-settings"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></user-setting>
        <leaderboard-modal

          inline
          class="hidden w-full h-full page-content relative z-50"
        ></leaderboard-modal>
        <troubleshooting-modal

          inline
          class="hidden w-full h-full page-content relative z-50"
        ></troubleshooting-modal>

        <clan-modal
          id="page-clan"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></clan-modal>
        <account-modal
          id="page-account"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></account-modal>
        <game-stats-modal
          id="page-stats"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></game-stats-modal>
        <player-profile-modal
          id="page-profile"
          inline
          class="hidden w-full h-full page-content relative z-50"
        ></player-profile-modal>
        <help-modal

          inline

      <div
        class="[.in-game_&]:hidden in-[.page-open]:compact:hidden mt-auto flex flex-col shrink-0"
      >
        <page-footer></page-footer>
      </div>

      <!-- Global Modals -->
      <steam-link-modal></steam-link-modal>

      <!-- Opened from the nav profile menu (#modal=...) -->
      <account-settings-modal></account-settings-modal>

    <!-- Game components -->
    <div id="app"></div>

    <!-- Bottom HUD: one dark bar across the bottom (who / troops / attack
         share / gold | build slots 1-0). Events and chat sit above its left
         end, the tutorial panel above its middle. -->
    <div
      class="fixed bottom-0 left-0 w-full z-[200] flex flex-col gap-2 pointer-events-none lg:px-4 lg:pb-3"
      style="
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      "
    >
      <div
        class="flex flex-col gap-2 pointer-events-none sm:flex-row sm:items-end sm:justify-between"
      >
        <div
          class="flex flex-col pointer-events-none items-start w-full sm:w-auto sm:max-w-[min(32rem,45vw)]"
        >
          <chat-display
            class="w-full sm:w-auto pointer-events-auto"
          ></chat-display>
          <events-display
            class="w-full sm:w-auto pointer-events-auto"
          ></events-display>
          <actionable-events
            class="w-full sm:w-auto pointer-events-auto"
          ></actionable-events>
        </div>
        <tutorial-panel
          class="hidden w-full sm:w-[500px] sm:mx-auto pointer-events-auto"
        ></tutorial-panel>
        <div class="hidden sm:block sm:flex-1"></div>
      </div>
      <div
        class="tc-hud-bar pointer-events-auto mx-auto flex w-full flex-col lg:w-auto lg:max-w-full lg:flex-row lg:items-center lg:gap-3 lg:px-3 lg:py-2"
      >
        <control-panel class="w-full lg:w-auto"></control-panel>
        <div class="hidden lg:block w-px self-stretch bg-white/10"></div>

    <!-- Game modals and overlays -->
    <emoji-table></emoji-table>
    <build-menu></build-menu>
    <win-modal></win-modal>
    <onboarding-overlay></onboarding-overlay>
    <new-lobby-prompt></new-lobby-prompt>
    <game-starting-modal></game-starting-modal>
    <!-- Top HUD: below lg each piece is fixed on its own. From lg, where the
         leaderboard opens by default, they share one row, leaderboard | card |
         sidebar: the card is centered when it fits and shifts right or narrows
         to clear the open leaderboard instead of covering it. -->
    <div
      class="contents lg:fixed lg:top-0 lg:inset-x-0 lg:z-1000 lg:grid lg:grid-cols-[minmax(max-content,1fr)_minmax(0,max-content)_minmax(max-content,1fr)] lg:items-start lg:pointer-events-none"
    >
      <game-left-sidebar
        class="lg:col-start-1 lg:justify-self-start"
      ></game-left-sidebar>
      <player-info-overlay
        class="lg:col-start-2 lg:min-w-0 lg:mt-[6.5rem]"
      ></player-info-overlay>
      <div
        class="flex flex-col items-end gap-2 max-lg:fixed max-lg:top-0 max-lg:right-0 max-lg:z-1000 lg:col-start-3 lg:justify-self-end lg:pointer-events-auto"
      >
        <game-right-sidebar></game-right-sidebar>
        <replay-panel></replay-panel>
        <world-rank-pill class="mr-3 lg:mr-0"></world-rank-pill>
        <attacks-display
          class="w-[min(20rem,92vw)] mr-3 lg:mr-0 pointer-events-auto"
        ></attacks-display>
      </div>
    </div>
    <!-- Top centre: match clock and the World control bar. -->
    <world-control-panel
      class="fixed top-3 left-1/2 -translate-x-1/2 z-[1001] pointer-events-none hidden md:block"
    ></world-control-panel>
    <settings-modal></settings-modal>
    <!-- The in-game settings modal: the same component as #page-settings, but
         non-inline, and mounted out here because the page's copy sits in a
         subtree that is hidden during a match. It must stay AFTER
         #page-settings in document order: ModalRouter.routeFromHash and
         Main.ts both resolve this component with
         document.querySelector("user-setting"), which takes the first match. -->
    <user-setting id="game-settings"></user-setting>
    <player-panel></player-panel>
    <spawn-timer></spawn-timer>
    <immunity-timer></immunity-timer>
    <in-game-promo></in-game-promo>
    <alert-frame></alert-frame>
    <chat-modal></chat-modal>
    <multi-tab-modal></multi-tab-modal>
    <performance-overlay></performance-overlay>
    <heads-up-message></heads-up-message>

    <!-- Featured stream: direct <body> child (NOT inside the in-[.in-game]:hidden
         home container) so the Twitch iframe is never display:none'd during a game,
         which would unmount the player and break ToS-compliant playback. The
         component is position:fixed and self-manages visibility (pauses in-game). -->
    <featured-stream></featured-stream>

    <!-- Steam shell status bar. A direct <body> child, like
         featured-stream above, so it is not inside the home container -- but
         unlike it, deliberately hidden in-game (see the component's comment).
         Renders nothing outside the desktop shell. -->
    <desktop-status-bar></desktop-status-bar>

    <!-- Scripts -->
    <script>
      // Remove preload class after everything is loaded
      window.addEventListener("load", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });

      // Fallback: remove preload class after timeout in case DOMContentLoaded never fires
      setTimeout(function () {
        document.documentElement.classList.remove("preload");
      }, 3000);
    </script>

    <script>
      // Fallback sidebar toggle so hamburger works even if module bundle fails to load
      window.__toggleSidebar = function (e) {
        try {
          const sidebar = document.getElementById("sidebar-menu");
          const backdrop = document.getElementById("mobile-menu-backdrop");
          if (!sidebar || !backdrop) return;

          const isOpen = sidebar.classList.contains("open");

          if (isOpen) {
            sidebar.classList.remove("open");
            backdrop.classList.remove("open");
            document.documentElement.classList.remove("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "true");
            sidebar.removeAttribute("aria-modal");
            backdrop.setAttribute("aria-hidden", "true");
          } else {
            sidebar.classList.add("open");
            backdrop.classList.add("open");
            document.documentElement.classList.add("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "false");
            sidebar.setAttribute("aria-modal", "true");
            backdrop.setAttribute("aria-hidden", "false");
          }

          const hb = document.getElementById("hamburger-btn");
          if (hb) hb.setAttribute("aria-expanded", (!isOpen).toString());
        } catch (err) {
          console.error("Toggle failed", err);
        }
      };

      // Wire up the hamburger button inline
      const hamburger = document.getElementById("hamburger-btn");
      if (hamburger) {
        hamburger.onclick = window.__toggleSidebar;
        hamburger.setAttribute("aria-expanded", "false");
      }

      // Wire up backdrop click to close menu
      const backdrop = document.getElementById("mobile-menu-backdrop");
      if (backdrop) {
        backdrop.onclick = function (e) {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        };
      }

      // Wire up Escape key to close menu
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc") {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        }
      });
    </script>

    <script type="module" src="/src/client/Main.ts"></script>
  </body>
</html>
